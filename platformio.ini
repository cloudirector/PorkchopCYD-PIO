; PorkChop CYD — PlatformIO Project Configuration
;
; Environments:
;   esp32dev   — ESP32-2432S028R "Cheap Yellow Display" (Elegoo variant, Xtensa)
;   esp32c5dev — NM-CYD-C5 (RockBase-iot / NMTech, RISC-V)
;
; Platform: pioarduino/espressif32 — community platform tracking Arduino ESP32 3.x
; (Official espressif32@7.0.1 only ships Arduino core 2.0.17 / IDF 4.x)

[platformio]
; Source in main/ — avoids PlatformIO's mandatory .ino→.cpp conversion
src_dir = main

; ── Shared settings ────────────────────────────────────────────────────────
[common]
platform     = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework    = arduino
extra_scripts = pre:extra_scripts.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11 -std=gnu++14
lib_deps_common =
    bodmer/TFT_eSPI       @ ^2.5.43
    mikalhart/TinyGPSPlus @ ^1.1.0
tft_flags_common =
    -std=gnu++17
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; ── ESP32-2432S028R (Elegoo CYD, Xtensa ESP32) ─────────────────────────────
[env:esp32dev]
platform      = ${common.platform}
framework     = ${common.framework}
board         = esp32dev
extra_scripts = ${common.extra_scripts}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_unflags = ${common.build_unflags}
build_src_filter = -<*> +<PorkChop_CYD.cpp>

board_build.mcu        = esp32
board_build.f_cpu      = 240000000L
board_build.f_flash    = 80000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
upload_speed           = 921600

lib_deps =
    ${common.lib_deps_common}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    ${common.tft_flags_common}
    ; HSPI bus (MOSI=13 CLK=14 CS=15 DC=2 BL=21)
    -DUSE_HSPI_PORT
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DSPI_FREQUENCY=20000000

; ── NM-CYD-C5 (RockBase-iot, RISC-V ESP32-C5) ─────────────────────────────
[env:esp32c5dev]
platform      = ${common.platform}
framework     = ${common.framework}
board         = esp32c5
extra_scripts = ${common.extra_scripts}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_unflags = ${common.build_unflags}
build_src_filter = -<*> +<PorkChop_CYD_C5.cpp>

board_build.mcu        = esp32c5
board_build.f_cpu      = 240000000L
board_build.f_flash    = 80000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
upload_speed           = 921600

lib_deps =
    ${common.lib_deps_common}

build_flags =
    ${common.tft_flags_common}
    ; Shared SPI bus (MOSI=7 MISO=2 CLK=6 CS=23 DC=24 BL=25)
    -DTFT_MOSI=7
    -DTFT_MISO=2
    -DTFT_SCLK=6
    -DTFT_CS=23
    -DTFT_DC=24
    -DTFT_RST=-1
    -DTFT_BL=25
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=1
    -DSPI_FREQUENCY=20000000
